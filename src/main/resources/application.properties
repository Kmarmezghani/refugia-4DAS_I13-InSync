# 1. Server Port (From your technical document)
server.port=8030

# 2. Application Name
spring.application.name=ms3-familles

# 3. Database Connection URL
# localhost:5432 is your local Postgres.
# familles_db is the database you created in pgAdmin.
spring.datasource.url=jdbc:postgresql://localhost:5432/familles_db

# 4. Database Credentials
spring.datasource.username=postgres
spring.datasource.password=Admin

# 5. JPA / Hibernate Configuration
# 'update' means: automatically create/update tables based on your Java classes.
spring.jpa.hibernate.ddl-auto=update

# Prints the SQL queries in the console so you can see what Hibernate is doing.
spring.jpa.show-sql=true

# Tells Hibernate to use PostgreSQL syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect