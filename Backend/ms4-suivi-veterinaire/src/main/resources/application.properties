spring.application.name=ms4-suivi-veterinaire
server.port=8040

eureka.client.enabled=false
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${MS4_DB_URL:jdbc:postgresql://localhost:5432/veterinaire_db}
spring.datasource.username=${MS4_DB_USER}
spring.datasource.password=${MS4_DB_PASSWORD}
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
