server.port=8020
spring.application.name=adoptions

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/adoptions_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:sys}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka désactivé pour l'instant (pas encore de serveur Eureka)
eureka.client.enabled=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html